name: Release

# Pushing a tag like v0.1.1 tests the code, builds the server and the desktop app on Linux, macOS
# and Windows, and gathers them into a draft release. The Android app is signed with a key kept off
# GitHub, so it's built and attached by hand (packaging/attach-apk.sh) before the draft is published.
# latest*.yml and the .blockmap files are what the desktop app reads to update itself.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:   # build and check everything without releasing (the draft needs a tag)

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-system

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: bash test.sh -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/*.test.mjs

  server:
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - if: runner.os == 'Windows'
        name: Inno Setup, for the Windows setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: uv run --no-dev --with pyinstaller ${{ runner.os == 'Windows' && '--with pystray' || '' }} python packaging/build_server.py
      - if: runner.os == 'Windows'
        name: Try the Windows setup (install, run from the tray, uninstall)
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          function Wait-Ping($want) {
            for ($i = 0; $i -lt 120; $i++) {
              Start-Sleep 1
              try { $p = Invoke-RestMethod http://127.0.0.1:4545/api/ping -TimeoutSec 5; if ($p.version -eq $want) { Write-Host "$(Get-Date -Format T) answered as $($p.version)"; return } else { Write-Host "answered as $($p.version)" } } catch { $last = $_.Exception.Message }
            }
            Write-Host "--- last error: $last"
            Write-Host "--- processes"; Get-Process 'Loft Server','loft-server' -ErrorAction SilentlyContinue | Format-Table Id,ProcessName,StartTime | Out-String | Write-Host
            Write-Host "--- listening on 4545"; Get-NetTCPConnection -LocalPort 4545 -ErrorAction SilentlyContinue | Format-Table State,OwningProcess | Out-String | Write-Host
            foreach ($log in 'tray.log','server.log') {
              Write-Host "--- $log"; Get-Content "$env:LOCALAPPDATA\Loft\$log" -ErrorAction SilentlyContinue | Write-Host
            }
            Get-Process 'Loft Server','loft-server' -ErrorAction SilentlyContinue | Stop-Process -Force
            Write-Host "--- loft-server.exe on its own"
            $alone = Start-Process "$env:LOCALAPPDATA\Programs\Loft Server\loft-server.exe" -RedirectStandardOutput "$env:RUNNER_TEMP\alone.txt" -RedirectStandardError "$env:RUNNER_TEMP\alone-err.txt" -PassThru
            Start-Sleep 20; Stop-Process $alone -Force -ErrorAction SilentlyContinue
            Get-Content "$env:RUNNER_TEMP\alone.txt","$env:RUNNER_TEMP\alone-err.txt" | Write-Host
            throw "Loft didn't answer as $want"
          }
          $setup = (Get-ChildItem dist\loft-server-*-setup.exe)[0].FullName
          # Wait for the setup alone: -Wait would also wait for the tray it starts, which keeps running.
          $install = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -PassThru
          if (-not $install.WaitForExit(300000)) { throw "The setup didn't finish" }
          if ($install.ExitCode -ne 0) { throw "The setup failed ($($install.ExitCode))" }
          $dir = "$env:LOCALAPPDATA\Programs\Loft Server"
          foreach ($f in 'Loft Server.exe','loft-server.exe','unins000.exe','README.txt') { if (-not (Test-Path "$dir\$f")) { throw "The setup didn't install $f" } }
          # A silent install starts the tray in the background; the tray starts the server, hidden.
          Write-Host "$(Get-Date -Format T) installed; waiting for the tray's server"
          Wait-Ping $version
          if (-not (Get-Process 'Loft Server' -ErrorAction SilentlyContinue)) { throw "The tray isn't running" }
          $server = Get-Process loft-server
          if ($server.MainWindowHandle -ne 0) { throw "The server has a window" }
          if (-not (Test-Path "$env:LOCALAPPDATA\Loft\server.log")) { throw "No server.log" }
          if (-not (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Loft Server' -ErrorAction SilentlyContinue)) { throw "It doesn't start with Windows" }
          # The tray starts the server again when it stops by itself.
          Stop-Process $server -Force
          Write-Host "$(Get-Date -Format T) stopped the server; waiting for the tray to start it again"
          Start-Sleep 2
          Wait-Ping $version
          # A second start doesn't make a second tray.
          Start-Process "$dir\Loft Server.exe" -ArgumentList '--background'
          Start-Sleep 5
          if (@(Get-Process 'Loft Server').Count -ne 1) { throw "A second tray started" }
          # loft-server.exe double-clicked (or an old shortcut to it) hands over to the tray, without a console of its own.
          $server = Get-Process loft-server
          Start-Process "$dir\loft-server.exe"
          Start-Sleep 8
          if (@(Get-Process 'Loft Server').Count -ne 1) { throw "Double-clicking loft-server.exe didn't leave one tray" }
          $servers = @(Get-Process loft-server)
          if ($servers.Count -ne 1 -or $servers[0].Id -ne $server.Id) { throw "Double-clicking loft-server.exe ran a second server ($($servers.Count))" }
          Wait-Ping $version
          (Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -PassThru).WaitForExit(120000) | Out-Null
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\loft-server.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\loft-server.exe") { throw "Uninstalling left the server behind" }
          if (Get-Process 'Loft Server','loft-server' -ErrorAction SilentlyContinue) { throw "Uninstalling left Loft running" }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'Loft Server' -ErrorAction SilentlyContinue) { throw "Uninstalling left it starting with Windows" }
          Write-Output "Setup for $version installs, runs from the tray, and uninstalls."
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}
          path: |
            dist/loft-server-*.zip
            dist/loft-server-*.tar.gz
            dist/loft-server-*-setup.exe
          if-no-files-found: error

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: dist:linux
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

  draft:
    needs: [server, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # The release's "What's new", so servers can show it before they update.
          cp src/loft/web/whatsnew.json files/
          cd files && sha256sum * > SHA256SUMS.txt && cd ..
          notes="docs/releases/${TAG#v}.md"
          gh release create "$TAG" files/* --draft --verify-tag --title "Loft ${TAG#v}" \
            $( [ -f "$notes" ] && echo --notes-file "$notes" || echo --generate-notes )
