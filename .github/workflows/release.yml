name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      
      - name: Install build tools
        run: pip install build twine
      
      - name: Build distribution
        run: python -m build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  build-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  create-release:
    needs: [build-python, build-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
          body: |
            ## Loft ${{ github.ref_name }}
            
            Self-hosted ebook library with pages that turn like paper.
            
            ### What's Included
            - **Python Package**: `pip install loft==${{ github.ref_name }}`
            - **Docker**: `docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - **Source Code**: Build desktop/Android apps from source
            
            ### Features in This Release
            - What's New popup showing changelog on update
            - Automatic update checking from GitHub releases
            - Database backups with rotation policy
            - Multi-platform support (web, desktop, mobile, server)
            
            ### Installation
            See [README.md](https://github.com/${{ github.repository }}/blob/master/README.md) for detailed setup instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
