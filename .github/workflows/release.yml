name: Release

# Pushing a tag like v0.1.1 tests the code, builds the server and the desktop app on Linux, macOS
# and Windows, and gathers them into a draft release. The Android app is signed with a key kept off
# GitHub, so it's built and attached by hand before the draft is published.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-system

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: bash test.sh -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/*.test.mjs

  server:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - run: uv run --no-dev --with pyinstaller python packaging/build_server.py
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}
          path: |
            dist/loft-server-*.zip
            dist/loft-server-*.tar.gz
          if-no-files-found: error

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: dist:linux
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
          if-no-files-found: error

  draft:
    needs: [server, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd files && sha256sum * > SHA256SUMS.txt && cd ..
          notes="docs/releases/${TAG#v}.md"
          gh release create "$TAG" files/* --draft --verify-tag --title "Loft ${TAG#v}" \
            $( [ -f "$notes" ] && echo --notes-file "$notes" || echo --generate-notes )
