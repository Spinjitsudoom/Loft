name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      
      - name: Install build tools
        run: pip install build twine
      
      - name: Build distribution
        run: python -m build
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  create-release:
    needs: [build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download python artifacts
        uses: actions/download-artifact@v4
        with:
          name: python-dist
          path: dist/
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          draft: false
          prerelease: false
          body: |
            ## Loft ${{ github.ref_name }}
            
            Self-hosted ebook library with pages that turn like paper.
            
            ### Installation
            **PyPI:** `pip install loft==${{ github.ref_name }}`
            
            **Docker:** Build from source with `docker build -t loft:${{ github.ref_name }} .`
            
            **Desktop/Mobile:** Build from source - see README for instructions
            
            ### Features
            - What's New popup showing changelog
            - Automatic update checking
            - Database backups
            - Multi-platform support
            
            See [README.md](https://github.com/${{ github.repository }}) for setup.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
