name: Release

# Pushing a tag like v0.1.1 tests the code, builds the server and the desktop app on Linux, macOS
# and Windows, and gathers them into a draft release. The Android app is signed with a key kept off
# GitHub, so it's built and attached by hand (packaging/attach-apk.sh) before the draft is published.
# latest*.yml and the .blockmap files are what the desktop app reads to update itself.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-system

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: bash test.sh -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/js/*.test.mjs

  server:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --no-dev
      - if: runner.os == 'Windows'
        name: Inno Setup, for the Windows setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: uv run --no-dev --with pyinstaller python packaging/build_server.py
      - if: runner.os == 'Windows'
        name: Try the Windows setup (install, start, uninstall)
        shell: pwsh
        run: |
          $version = (Select-String -Path pyproject.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $setup = (Get-ChildItem dist\loft-server-*-setup.exe)[0].FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          $dir = "$env:LOCALAPPDATA\Programs\Loft Server"
          foreach ($f in 'loft-server.exe','unins000.exe','README.txt') { if (-not (Test-Path "$dir\$f")) { throw "The setup didn't install $f" } }
          $env:LOFT_DATA_DIR = "$env:RUNNER_TEMP\loft-data"
          $server = Start-Process "$dir\loft-server.exe" -WorkingDirectory $dir -PassThru
          $ping = $null
          for ($i = 0; $i -lt 60 -and -not $ping; $i++) {
            Start-Sleep 1
            try { $ping = Invoke-RestMethod http://127.0.0.1:4545/api/ping } catch { }
          }
          Stop-Process $server -Force
          if (-not $ping) { throw "The installed server didn't answer" }
          if ($ping.version -ne $version) { throw "The installed server is $($ping.version), not $version" }
          Start-Sleep 2
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\loft-server.exe"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\loft-server.exe") { throw "Uninstalling left the server behind" }
          Write-Output "Setup for $version installs, runs and uninstalls."
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.os }}
          path: |
            dist/loft-server-*.zip
            dist/loft-server-*.tar.gz
            dist/loft-server-*-setup.exe
          if-no-files-found: error

  desktop:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            script: dist:linux
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci --no-audit --no-fund
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.rpm
            desktop/dist/latest*.yml
            desktop/dist/*.blockmap
          if-no-files-found: error

  draft:
    needs: [server, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd files && sha256sum * > SHA256SUMS.txt && cd ..
          notes="docs/releases/${TAG#v}.md"
          gh release create "$TAG" files/* --draft --verify-tag --title "Loft ${TAG#v}" \
            $( [ -f "$notes" ] && echo --notes-file "$notes" || echo --generate-notes )
