name: Build Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.14'
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/

  build-desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: desktop
        run: npm install --no-optional && npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: desktop/dist/Loft-Setup-*.exe

  build-desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: desktop
        run: npm install --no-optional && npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: desktop/dist/Loft-*.dmg

  build-desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: desktop
        run: npm install --no-optional && npm run dist:deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: desktop/dist/loft_*.deb

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
      - working-directory: android-lite
        run: bash build.sh
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android-lite/build/loft-lite.apk

  create-release:
    needs: [build-python, build-desktop-windows, build-desktop-macos, build-desktop-linux, build-android]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          draft: false
          prerelease: false
          body: |
            ## Loft ${{ github.ref_name }}
            
            Self-hosted ebook library with pages that turn like paper.
            
            ### Available Downloads
            - **Windows**: Loft-Setup-*.exe
            - **macOS**: Loft-*.dmg
            - **Linux**: loft_*.deb
            - **Android**: loft-lite.apk
            - **Python**: `pip install loft==${{ github.ref_name }}`
            
            ### Features
            - What's New popup, Auto-update, Database backups
            - Multi-user library, Paper-curl reader
            - Support for 8+ ebook formats
            
            See README for setup guides.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
