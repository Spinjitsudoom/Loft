# Copy to config.toml and edit (or point LOFT_CONFIG at a file elsewhere). Environment variables
# LOFT_BOOKS_DIRS, LOFT_DATA_DIR, LOFT_HOST and LOFT_PORT override these.

# Folders containing your books. Subfolders are scanned. Loft only reads them.
books_dirs = ["/var/mnt/smb-g/EBooks"]

# Database and covers. Keep this on a local disk, not a network share.
# data_dir = "~/.local/share/loft"

host = "0.0.0.0"
port = 4545

# How often to look for new, changed or removed books.
scan_interval_minutes = 10

# How much disk the reader's page images may take up (MB).
page_cache_mb = 2048
