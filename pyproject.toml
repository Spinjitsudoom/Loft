[project]
name = "loft"
version = "0.1.2"
description = "A self-hosted ebook library with pages that turn like paper"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "itsdangerous>=2.2.0",
    "mobi>=0.3.3",
    "nh3>=0.2.17",
    "pillow>=11.0.0",
    "py7zr>=0.22",
    "pypdfium2>=4.30",
    "rarfile>=4.2",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
loft = "loft:main"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pypdf>=5.0",
    "pytest>=9.0",
]
